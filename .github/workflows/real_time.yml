name: Real-time Fetch and Parse Workflow

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '*/30 * * * *'  # 30分起きに実行

  permissions:
    contents: write

  jobs:
    test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.x
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
      - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r univ-athlete-db/requirements.txt
        pip install pytest
      # - name: Run pytest
      #   working-directory: univ-athlete-db
      #   run: pytest --maxfail=1 --disable-warnings -q

    fetch-and-parse:
    name: Fetch & Parse CLI
    runs-on: ubuntu-latest
    needs: test
    env:
      SPREAD_SHEET_ID_CONFERENCE: ${{ secrets.SPREADSHEET_ID_CONFERENCE }}
      SPREAD_SHEET_ID_MEMBER: ${{ secrets.SPREADSHEET_ID_MEMBER }}
      GOOGLE_ACCOUNT_KEY_SHEET_TF:  ${{ secrets.GOOGLE_ACCOUNT_KEY }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_BOT_TOKEN:   ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.x
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
      - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r univ-athlete-db/requirements.txt
      - name: Run CLI HTML
      working-directory: univ-athlete-db/src
      run: |
        python cli_html.py
        git config user.name "tun001"
        git config user.email "tune05155@gmail.com"
      - name: Commit and push changes
      run: |
        git add .
        git commit -m "📝 Update files via GitHub Actions" || echo "No changes to commit"
        git push origin main
